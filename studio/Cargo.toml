[package]
name = "studio"
version = "0.1.0"
edition = "2021"

[lib]
name = "studio"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "studio-standalone"
path = "src/main.rs"

[dependencies]
bevy-inspector-egui = { version = "0.20.0" }
bevy_mod_picking = { version = "0.16.0" }
console_error_panic_hook = { version = "0.1.7", optional = true }
parking_lot = "0.12.1"
wasm-bindgen = { version = "0.2.84" }

[features]
wasm = ["dep:console_error_panic_hook"]

[dependencies.bevy]
workspace = true
