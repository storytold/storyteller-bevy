name: Run unit tests
on:
  pull_request:
    branches:
      - production

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index/
            ~/.cargp/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-lint-and-test-${{ hashFiles('**/Cargo.toml') }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 18
          cache: npm
      - name: Install Linux dependencies
        run: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                libasound2-dev \
                libudev-dev \
                git
      - name: Install JS dependencies
        run: npm ci
      - name: Ensure unambiguous `production`
        if: github.ref != 'refs/heads/production'
        run: |
              git remote set-branches origin production
              git fetch --depth 1 origin production
              git branch production origin/production
      - name: Run Nx-configured `test` targets
        run: npx nx affected -t test --base=production --head=HEAD
