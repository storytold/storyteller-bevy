[workspace]
resolver = "2"
members = [
    "./bevy_mod_outline",
    "./studio"
]

[workspace.dependencies.bevy]
version = "0.11.3"
features = ["tonemapping_luts"]

[profile.dev-custom]
inherits = "dev"
opt-level = 1

[profile.dev-custom.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
